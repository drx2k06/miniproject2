[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crediedge-ai"
version = "2.0.0"
description = "Enterprise Credit Risk Underwriting & Loan Eligibility Decisioning Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel Richard Xavier" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.30.0",
]

[project.scripts]
crediedge = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
